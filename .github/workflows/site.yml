# The docs site pipeline: validate the hand-authored content against
# the engine's API dump, generate the book, build it, and (on main)
# deploy GitHub Pages. Pull requests run everything except the deploy,
# so a content PR is validated end-to-end before merge.
#
# The engine repo's CI commits model syncs (model/*.json, *.d.luau)
# into main; those pushes run this same pipeline, so an API change that
# breaks documented content turns THIS repo red — the drift gate.

name: site

on:
  push:
    branches: [main]
  pull_request:

env:
  MDBOOK_VERSION: v0.5.4
  LUAU_LSP_VERSION: 1.69.0

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: validate, generate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tool

      # The snippet type-checker — validate refuses to run without it.
      - name: Install luau-lsp
        run: |
          curl -sSL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -o luau-lsp.zip -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/luau-lsp"

      - name: Validate content and generate the book
        run: cargo run --manifest-path tool/Cargo.toml --locked -- generate .

      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Build the book (warnings fail)
        run: |
          mdbook build book 2>&1 | tee mdbook-build.log
          if grep -qE "WARN|ERROR" mdbook-build.log; then
            echo "::error::mdBook reported warnings — fix the pages"
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    name: deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
